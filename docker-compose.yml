services:
  backend:
    build:
      context: ./server
    container_name: nestjs_backend_dev
    environment:
      PORT: 3000
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      # Sincroniza tu código local con el contenedor
      - ./server:/app
      - /app/node_modules 
    restart: unless-stopped